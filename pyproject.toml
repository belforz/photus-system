[project]
name = "photus-system"
version = "0.1.0"
description = "Photus — pipeline de curadoria de fotos (SBERT + OpenCV/Random Forest)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.22.0",
    "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photus"]
