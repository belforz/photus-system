services:
  photus-system:
    build:
      context: .
      dockerfile: Dockerfile
    image: photus-system:latest
    container_name: photus-system
    ports:
      - "7860:7860"
      - "8001:8001"
      - "127.0.0.1:8000:8000"
    env_file:
      - ${PHOTUS_B_ENV_FILE:-../photus-b/.env}
    environment:
      PHOTUS_UC_URL: ${PHOTUS_UC_URL:-http://localhost:8001}
      PHOTUS_B_URL: ${PHOTUS_B_URL:-http://localhost:8000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/photus.db}
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
    volumes:
      - ./data:/app/photus-system/data
      - photus_uc_data:/app/photus-uc/data
    restart: unless-stopped

volumes:
  photus_uc_data:
